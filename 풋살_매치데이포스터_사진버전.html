<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>풋살 매치데이 포스터 (사진 버전)</title>
<style>
  @page { size: A4; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #222; }
  body { display: flex; justify-content: center; }
  /* 원본 사진 399x501 기준 좌표로 배치하고 2배 확대 (A4 폭에 맞춤) */
  .poster { width: 399px; height: 501px; position: relative; overflow: hidden; zoom: 1.99; color: #fff; text-align: center;
    background: url("풋살_매치데이포스터_배경사진.jpg") 0 0 / 399px 501px no-repeat;
    font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
  .poster > * { position: absolute; }
  /* 상단 전광판 문구 */
  .head { left: 0; right: 0; top: 0; height: 66px; background: linear-gradient(180deg, rgba(12,18,70,1) 80%, rgba(12,18,70,0)); padding-top: 12px; }
  .head b { display: block; font-size: 13px; letter-spacing: 1.5px; }
  .head span { display: block; margin-top: 3px; font-size: 6.5px; letter-spacing: 2.5px; opacity: .85; }
  /* 깃발 글자 덮개 + 새 글자 */
  .flagpatch { left: 82px; top: 152px; width: 272px; height: 140px; transform: rotate(-13deg);
    background: repeating-linear-gradient(100deg, #e9eaf8 0 38px, #cfd3ef 38px 62px, #f2f3fb 62px 90px), #dcdef2; background-blend-mode: normal; border-radius: 22px; filter: blur(1.2px); opacity: .97; box-shadow: inset 0 0 18px rgba(20,35,120,.35); }
  .flagtext { left: 82px; top: 152px; width: 272px; height: 140px; transform: rotate(-13deg); display: flex; align-items: center; justify-content: center;
    font-size: 54px; font-weight: 900; font-style: italic; letter-spacing: -2px; color: #fff; -webkit-text-stroke: 3px #0f1f6b; paint-order: stroke fill; }
  /* 인용구 */
  .quote { left: 8px; top: 62px; width: 142px; height: 78px; background: rgba(9,13,56,.98); border-left: 2px solid #fff; border-radius: 2px;
    text-align: left; padding: 9px 8px 0 10px; font-size: 8.6px; font-weight: 700; line-height: 1.45; }
  .quote i { display: block; font-style: normal; font-size: 17px; line-height: .7; font-family: Georgia, serif; color: #cfd8ff; }
  /* 우상단 리그 표기 */
  .patch2 { left: 20px; top: 146px; width: 26px; height: 26px; background: rgba(26,36,115,.97); filter: blur(3px); }
  .league { left: 226px; top: 357px; width: 124px; height: 18px; background: rgba(10,14,60,.88); border-radius: 2px; font-size: 6.6px; font-weight: 700; letter-spacing: .6px; line-height: 18px; }
  /* 하단 경기 정보 */
  .plate { left: 22px; right: 22px; top: 424px; height: 74px; background: rgba(6,8,34,.9); border-radius: 4px; padding-top: 5px; }
  .plate .when { font-size: 12.5px; font-weight: 800; }
  .plate .where { margin-top: 3px; font-size: 7px; opacity: .92; }
  .plate .joke { margin-top: 5px; font-size: 7.2px; font-weight: 700; color: #ffd9a8; }
  .plate .safe { margin: 5px 10px 0; padding: 3px 0; border: 1px solid #ffb74d; border-radius: 3px; background: rgba(255,183,77,.14); font-size: 6.8px; font-weight: 700; color: #ffe0b2; }
  @media print { html, body { background: none; } }
</style>
</head>
<body>
<div class="poster">
  <div class="head"><b>푸드올마켓 사내 친목 풋살</b><span>FOODALL FUTSAL CLUB</span></div>
  <div class="flagpatch"></div>
  <div class="flagtext">푸드올</div>
  <div class="patch2"></div>
  <div class="quote"><i>“</i>푸드올마켓, 그 다섯 글자를<br>내일 아침 근육통에 새긴다</div>
  <div class="league">FOODALL LEAGUE 2026 · 복귀전</div>
  <div class="plate">
    <div class="when">10월 14일 (수) 오후 7시 ~ 9시</div>
    <div class="where">이천축구센터 실내구장 · 경기 이천시 백사면 청백리로 125-88</div>
    <div class="joke">2~3개월 만의 복귀전, 몸은 기억 못 해도 열정은 기억한다</div>
    <div class="safe">⚠ 안전 제일 | 스트레칭 필수 · 과격한 태클 금지 · 실내용 풋살화 착용 · 아프면 바로 교체</div>
  </div>
</div>
</body>
</html>
